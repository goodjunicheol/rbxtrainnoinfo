<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로블록스 철도 열번·차량 안내</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2330;--sub:#667085;--line:#e1e5ec;--ac:#1f6feb;--acx:#fff;--dg:#c62828;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e8ecf2;--sub:#9aa5b5;--line:#2c3643;--ac:#5aa0ff;--acx:#0b1220;--dg:#ff7b72}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222b;--tx:#e8ecf2;--sub:#9aa5b5;--line:#2c3643;--ac:#5aa0ff;--acx:#0b1220;--dg:#ff7b72}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 2px}
.sub{color:var(--sub);font-size:.9rem;margin:0 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;font-size:1rem;cursor:pointer}
.tab.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.search{margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.num{font-size:1.15rem;font-weight:700}
.tag{display:inline-block;font-size:.78rem;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--sub);margin-right:6px}
.note{color:var(--sub);font-size:.92rem;margin-top:4px;white-space:pre-wrap}
.acts button{border:0;background:none;color:var(--ac);cursor:pointer;padding:4px 6px;font-size:.9rem}
.acts .del{color:var(--dg)}
form{display:grid;gap:8px;margin-bottom:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.go{background:var(--ac);color:var(--acx);border:0;border-radius:10px;padding:11px;font-weight:600;cursor:pointer}
.empty,.msg{color:var(--sub);text-align:center;padding:22px 8px}
.msg{border:1px dashed var(--line);border-radius:10px;margin-bottom:12px;padding:10px;font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>🚆 로블록스 철도 열번·차량 안내</h1>
  <p class="sub">친구들과 함께 열번과 차량 정보를 채워가는 페이지예요.</p>
  <div id="msg"></div>
  <div class="tabs">
    <button class="tab on" data-t="trains">열번</button>
    <button class="tab" data-t="vehicles">차량</button>
  </div>
  <section id="trains"></section>
  <section id="vehicles" hidden></section>
</main>
<script>
(function(){
  var db=null, canWrite=true, data={trains:[],vehicles:[]}, editing={trains:null,vehicles:null}, q='';
  var tabs=document.querySelectorAll('.tab');
  function el(tag,props,kids){var e=document.createElement(tag);for(var k in (props||{})){if(k==='text')e.textContent=props[k];else if(k==='cls')e.className=props[k];else e.setAttribute(k,props[k]);}(kids||[]).forEach(function(c){if(c)e.appendChild(c);});return e;}
  tabs.forEach(function(b){b.onclick=function(){tabs.forEach(function(x){x.classList.toggle('on',x===b);});['trains','vehicles'].forEach(function(id){document.getElementById(id).hidden=(id!==b.dataset.t);});};});

  function note(t){var m=document.getElementById('msg');m.innerHTML='';if(t)m.appendChild(el('div',{cls:'msg',text:t}));}
  function nat(a,b){return String(a).localeCompare(String(b),'ko',{numeric:true});}

  function form(kind){
    var ed=data[kind].filter(function(x){return x.id===editing[kind];})[0]||{};
    var f=el('form');
    var a,b,c,d;
    if(kind==='trains'){
      a=el('input',{placeholder:'열번 (예: 1201)',required:'required'});a.value=ed.number||'';
      b=el('input',{placeholder:'노선 (예: 4호선)'});b.value=ed.line||'';
      c=el('input',{placeholder:'투입 차량',list:'vlist'});c.value=ed.vehicle||'';
      var dl=el('datalist',{id:'vlist'});data.vehicles.forEach(function(v){dl.appendChild(el('option',{value:v.name}));});
      d=el('textarea',{placeholder:'비고 (운행 구간, 팁 등)',rows:'2'});d.value=ed.note||'';
      f.appendChild(el('div',{cls:'f2'},[a,b]));f.appendChild(c);f.appendChild(dl);
    }else{
      a=el('input',{placeholder:'차량 이름·형식',required:'required'});a.value=ed.name||'';
      b=el('input',{placeholder:'종류 (예: 전동차, 기관차)'});b.value=ed.type||'';
      d=el('textarea',{placeholder:'설명 (특징, 얻는 방법 등)',rows:'2'});d.value=ed.note||'';
      f.appendChild(el('div',{cls:'f2'},[a,b]));
    }
    f.appendChild(d);
    f.appendChild(el('button',{cls:'go',type:'submit',text:ed.id?'수정 저장':'추가하기'}));
    if(ed.id){var cn=el('button',{type:'button',cls:'tab',text:'취소'});cn.onclick=function(){editing[kind]=null;render();};f.appendChild(cn);}
    f.onsubmit=function(e){
      e.preventDefault();
      var body=kind==='trains'?{number:a.value.trim(),line:b.value.trim(),vehicle:c.value.trim(),note:d.value.trim()}:{name:a.value.trim(),type:b.value.trim(),note:d.value.trim()};
      var ref=db.collection(kind).doc(editing[kind]||undefined);
      ref.set(body).then(function(){editing[kind]=null;}).catch(function(){note('저장하지 못했어요. 쓰기 권한이 없거나 잠시 문제가 있을 수 있어요.');});
    };
    return f;
  }

  function item(kind,x){
    var left=[],top;
    if(kind==='trains'){
      top=el('div',{cls:'num',text:'열번 '+x.number});
      var tags=el('div');
      if(x.line)tags.appendChild(el('span',{cls:'tag',text:x.line}));
      if(x.vehicle){
        var v=data.vehicles.filter(function(y){return y.name===x.vehicle;})[0];
        tags.appendChild(el('span',{cls:'tag',text:'🚃 '+x.vehicle+(v&&v.type?' · '+v.type:'')}));
      }
      left=[top,tags];
    }else{
      top=el('div',{cls:'num',text:x.name});
      left=[top];
      if(x.type)left.push(el('div',null,[el('span',{cls:'tag',text:x.type})]));
    }
    if(x.note)left.push(el('div',{cls:'note',text:x.note}));
    var l=el('div',null,left);
    var acts=el('div',{cls:'acts'});
    if(canWrite&&db){
      var e=el('button',{text:'수정'});e.onclick=function(){editing[kind]=x.id;render();window.scrollTo(0,0);};
      var d=el('button',{cls:'del',text:'삭제'});d.onclick=function(){if(confirm('삭제할까요?'))db.collection(kind).doc(x.id).delete();};
      acts.appendChild(e);acts.appendChild(d);
    }
    return el('div',{cls:'card'},[el('div',{cls:'row'},[l,acts])]);
  }

  function render(){
    ['trains','vehicles'].forEach(function(kind){
      var box=document.getElementById(kind);
      var keep=document.activeElement;
      box.innerHTML='';
      if(kind==='trains'){
        var s=el('input',{cls:'search',type:'search',placeholder:'열번·노선·차량으로 검색'});s.value=q;
        s.oninput=function(){q=s.value;render();var n=document.querySelector('#trains .search');if(n){n.focus();n.setSelectionRange(q.length,q.length);}};
        box.appendChild(s);
      }
      if(db&&canWrite)box.appendChild(form(kind));
      var list=data[kind].slice().sort(function(a,b){return kind==='trains'?nat(a.number,b.number):nat(a.name,b.name);});
      if(kind==='trains'&&q){var k=q.toLowerCase();list=list.filter(function(x){return [x.number,x.line,x.vehicle,x.note].join(' ').toLowerCase().indexOf(k)>-1;});}
      if(!list.length)box.appendChild(el('div',{cls:'empty',text:q?'검색 결과가 없어요.':(kind==='trains'?'아직 등록된 열번이 없어요. 첫 열번을 추가해 보세요!':'아직 등록된 차량이 없어요. 첫 차량을 추가해 보세요!')}));
      list.forEach(function(x){box.appendChild(item(kind,x));});
    });
  }

  render();
  (async function(){
    try{
      var c=window.claude;
      if(c&&c.use){
        db=await c.use('db');
        var u=await c.use('user');
        if(u&&u.can&&u.can('data.write')===false)canWrite=false;
      }
    }catch(e){db=null;}
    if(!db){note('로그인한 상태에서 열어야 목록을 보고 추가할 수 있어요.');render();return;}
    if(!canWrite)note('지금은 보기만 가능해요. 추가·수정은 기여자 권한이 필요해요.');
    ['trains','vehicles'].forEach(function(kind){
      db.collection(kind).onSnapshot(function(snap){
        data[kind]=snap.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o;});
        var a=document.activeElement;
        if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.closest('form'))return;
        render();
      },function(){note('데이터를 불러오지 못했어요.');});
    });
  })();
})();
</script>
</body>
</html>
